<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.2" result="b1"/>
      <feGaussianBlur stdDeviation="3" result="b2"/>
      <feGaussianBlur stdDeviation="6" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#000"/>
  <!-- 3x3 grid -->
  <g filter="url(#glow)" fill="none" stroke="#fcee0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="36" height="36" rx="2"/>
    <line x1="14" y1="26" x2="50" y2="26"/>
    <line x1="14" y1="38" x2="50" y2="38"/>
    <line x1="26" y1="14" x2="26" y2="50"/>
    <line x1="38" y1="14" x2="38" y2="50"/>
  </g>
  <!-- filled centre cell -->
  <g filter="url(#glow)" fill="#fcee0a">
    <rect x="27" y="27" width="10" height="10" rx="1.5"/>
  </g>
</svg>
