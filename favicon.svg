<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.2" result="b1"/>
      <feGaussianBlur stdDeviation="3" result="b2"/>
      <feGaussianBlur stdDeviation="6" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#000"/>
  <!-- 4x4 detected grid -->
  <g filter="url(#glow)" fill="none" stroke="#fcee0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="12" width="40" height="40" rx="2"/>
    <line x1="12" y1="22" x2="52" y2="22"/>
    <line x1="12" y1="32" x2="52" y2="32"/>
    <line x1="12" y1="42" x2="52" y2="42"/>
    <line x1="22" y1="12" x2="22" y2="52"/>
    <line x1="32" y1="12" x2="32" y2="52"/>
    <line x1="42" y1="12" x2="42" y2="52"/>
  </g>
  <!-- lit cells: top-left whole cell + a mid accent -->
  <g filter="url(#glow)" fill="#fcee0a">
    <rect x="13.5" y="13.5" width="7" height="7" rx="1"/>
    <rect x="33.5" y="33.5" width="7" height="7" rx="1" opacity="0.6"/>
  </g>
</svg>
